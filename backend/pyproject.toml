[project]
name = "archivision-ai-backend"
version = "0.0.1"
description = "ArchiVision AI — FastAPI backend"
requires-python = ">=3.11"
readme = "README.md"

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
